[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godseye"
version = "0.1.0"
description = "Drone-video-to-3D-scene reconstruction pipeline (local orchestrator + Modal compute plane)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.16,<1.0",
    "rich>=14.1,<15.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "python-dotenv>=1.1,<2.0",
    "numpy>=2.1,<3.0",
    "opencv-python>=4.11,<5.0",
    "modal>=1.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9.0"]

[project.scripts]
godseye = "godseye.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "modal_app", "tests"]
